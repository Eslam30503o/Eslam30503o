name: GitHub Contributions Snake

on:
  schedule:
    - cron: '0 0 * * *' # يوميًا عند منتصف الليل
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install -g github-contributions-snake

    - name: Generate contributions snake
      run: github-contributions-snake --user eslam30503o --output ./output/github-contribution-grid-snake-dark.svg --theme dark

    - name: Commit & Push
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add ./output/github-contribution-grid-snake-dark.svg
        git commit -m "Update contributions snake"
        git push

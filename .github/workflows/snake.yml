name: GitHub Contributions Snake

# يشغّل كل يوم أو يدويًا
on:
  schedule:
    - cron: '0 0 * * *' # كل يوم منتصف الليل
  workflow_dispatch: # لتشغيله يدويًا من تبويب Actions

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ نسخ المستودع
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ تثبيت Python (مطلوب لتشغيل سكريبت الـ Snake)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3️⃣ توليد الـ contributions snake
      - name: Generate GitHub Contributions Snake
        run: |
          pip install github-contributions-snake
          mkdir -p output
          github-contributions-snake --output output/github-contribution-grid-snake-dark.svg --theme dark

      # 4️⃣ رفع التغييرات على الريبو
      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/github-contribution-grid-snake-dark.svg
          git commit -m "Update contributions snake"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
